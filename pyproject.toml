[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleflow"
version = "0.1.0"
description = "TeleFlow — 座机声音流转助手: local SIP UA + lossless audio routing to a user-selected sound card"
requires-python = ">=3.10"
dependencies = ["PyQt6"]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/teleflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
