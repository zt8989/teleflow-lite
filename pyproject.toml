[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teleflow"
version = "0.1.0"
description = "TeleFlow — 座机声音流转助手: local SIP UA + lossless audio routing to a user-selected sound card"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    # Phone-report TTS (feature teleflow-phone-report): synthesizes report speech.
    "edge-tts",
]

# pjsua2 (the native SIP transport) is an OPTIONAL dependency, not a default one. It is a
# platform-specific vendored wheel (dist/pjsua2-2.17-*.whl) produced by
# scripts/build_pjsua2_wheel.py from a from-source build (macOS: docs/build-pjsua2.md;
# Windows: §7). It is kept optional so a plain `uv sync` succeeds on EVERY platform even
# before the wheel exists — uv would otherwise try to read the wheel's metadata during
# resolution and fail on a machine that hasn't built it. Build the wheel, then install it
# with `uv sync --extra pjsua2` (the build script runs this for you). On any other platform
# (e.g. Linux CI) the extra is simply not installed (the test suite and FakeSipBackend only
# need pjsua2 for the real SIP transport, never for tests/CI).
[project.optional-dependencies]
pjsua2 = ["pjsua2 ; (sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.14') or (sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.14')"]

# ffmpeg is an *external binary* required by the phone-report feature to transcode
# the synthesized mp3 into an 8 kHz mono wav pjsua2 can play. It is not a pip
# package: install it via Homebrew (`brew install ffmpeg`) or any package manager,
# make it available on PATH, or set `ffmpeg_path` in TeleFlow settings. The app
# locates it automatically (PATH) or via that explicit setting.
# Dev-only tools live in a uv dependency-group (not a published extra) so that
# `uv sync` installs them automatically and `uv run <tool>` finds them. `wheel` and
# `setuptools` are included because scripts/build_pjsua2_wheel.py (and the pjsua2 source
# build in docs/build-pjsua2.md) need them at build time.
[dependency-groups]
dev = ["pytest", "mypy", "wheel", "setuptools", "pyinstaller"]

# Dependency management is done with uv (`uv sync` / `uv run` / `uv lock`); `uv.lock` is
# committed for reproducible installs. `pjsua2` is vendored as a local wheel in `dist/` (see
# above and docs/build-pjsua2.md), resolved by name via find-links; it is reinstalled by
# `uv sync --extra pjsua2` / `uv run` — those commands are safe for this project.
# pjsua2 is resolved by NAME from the local wheel store `dist/` via the flat index below
# (uv scans the directory and picks the wheel whose platform tags match the current host), so
# NO platform-specific filename appears in this committed file. `dist/` holds only the current
# platform's wheel (scripts/build_pjsua2_wheel.py builds+installs it); the dependency marker
# above then gates installation back to just that platform. A mac and a Windows box use this
# same file unchanged — unlike a `[tool.uv.sources]` path (even marker-gated), which uv reads
# during resolution and would fail on the platform whose wheel file isn't present.
[tool.uv]
find-links = ["dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/teleflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
